name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles
          ref: feature/task-57-core-rc-readiness
          path: muscles
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ./muscles --no-deps
      - run: python -m pip install watchdog jinja2 jsonschema python-magic requests requests-toolbelt dnspython pytest
      - run: python -m pip install -e . --no-deps
      - run: PYTHONPATH=src python -m pytest --import-mode=importlib -q
      - run: python -m build --wheel --sdist
