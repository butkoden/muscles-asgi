[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "muscles-asgi"
version = "1.0.1"
description = "Muscles ASGI runtime adapter for Web/API applications"
readme = "README.md"
authors = ["Denis B. <denis@butko.info>"]
license = "MIT"
packages = [{include = "muscles", from = "src"}]

[tool.poetry.urls]
Homepage = "https://github.com/butkoden/muscles-asgi"
Repository = "https://github.com/butkoden/muscles-asgi"
Documentation = "https://github.com/butkoden/muscles-asgi#readme"
PyPI = "https://pypi.org/project/muscles-asgi/"
Releases = "https://github.com/butkoden/muscles-asgi/releases"
"muscles" = "https://pypi.org/project/muscles/"
"muscles-wsgi" = "https://pypi.org/project/muscles-wsgi/"
"muscles-cli" = "https://pypi.org/project/muscles-cli/"
"muscles-sse" = "https://pypi.org/project/muscles-sse/"
"muscles-mcp" = "https://pypi.org/project/muscles-mcp/"
"muscles-benchmarks" = "https://pypi.org/project/muscles-benchmarks/"


[tool.poetry.dependencies]
python = ">=3.10,<4.0"
muscles = ">=1.0.0rc1,<2.0.0"
watchdog = "^4.0.0"
uwsgi = {version = "==2.0.20", optional = true}
jinja2 = "==3.1.2"
jsonschema = "==4.16.0"
python-magic = {version = "==0.4.27", optional = true}
requests = "^2.31.0"
requests-toolbelt = "^1.0.0"
dnspython = "==2.6.1"


[tool.poetry.dev-dependencies]
pytest = "==7.1.3"
setuptools = "==69.0.2"

[tool.poetry.extras]
server = ["uwsgi"]
mime = ["python-magic"]
